name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Android Build
  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fdm-tflite-detector
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Build with Gradle
        run: ./gradlew assembleDebug --no-daemon --refresh-dependencies
      
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: fdm-tflite-detector/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
