name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Android Build
  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fdm-tflite-detector

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew clean assembleDebug \
            --no-daemon \
            --no-build-cache \
            --warning-mode all

      - name: Verify APK exists
        run: |
          ls -la app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fdm-smartlens-debug
          path: fdm-tflite-detector/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
