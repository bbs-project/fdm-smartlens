name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # React Native - Quality Check
  react-native-quality:
    name: React Native Quality Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fdm-yolov8n-vgg16
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: fdm-yolov8n-vgg16/yarn.lock
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      
      - name: Run ESLint
        run: yarn lint --max-warnings=0
        continue-on-error: true
      
      - name: TypeScript type check
        run: yarn typecheck
      
      - name: Run tests
        run: yarn test --coverage --coverage-reporters=text-summary
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./fdm-yolov8n-vgg16/coverage/lcov.info
          flags: react-native

  # Android Build
  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fdm-tflite-detector
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build with Gradle
        run: ./gradlew assembleDebug
      
      - name: Run tests
        run: ./gradlew test
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: fdm-tflite-detector/app/build/outputs/apk/debug/app-debug.apk

  # Web Dashboard Build
  web-build:
    name: Web Dashboard Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fdm-yolov8n-vgg16
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: fdm-yolov8n-vgg16/yarn.lock
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      
      - name: Build web
        run: yarn web --no-dev
        continue-on-error: true

  # Deploy to GitHub Pages (Web Dashboard)
  deploy-web:
    name: Deploy Web Dashboard
    runs-on: ubuntu-latest
    needs: [react-native-quality, android-build, web-build]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./fdm-yolov8n-vgg16/web-dashboard
          publish_branch: gh-pages
        continue-on-error: true

  # Create Release
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [android-build]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-debug
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
