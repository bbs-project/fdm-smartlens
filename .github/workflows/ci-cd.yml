name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # React Native - Quality Check
  react-native-quality:
    name: React Native Quality Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fdm-yolov8n-vgg16
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: fdm-yolov8n-vgg16/yarn.lock
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      
      - name: TypeScript type check
        run: yarn typecheck
        continue-on-error: true
      
      - name: Run tests
        run: yarn test --passWithNoTests
        continue-on-error: true

  # Android Build
  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fdm-tflite-detector
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build with Gradle
        run: ./gradlew assembleDebug --no-daemon
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: fdm-tflite-detector/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
