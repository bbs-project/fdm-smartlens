version: 2
updates:
  # npm/yarn dependencies
  - package-ecosystem: "npm"
    directory: "/fdm-yolov8n-vgg16"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "bbs-project"
    labels:
      - "dependencies"
      - "security"

  # Gradle dependencies
  - package-ecosystem: "gradle"
    directory: "/fdm-tflite-detector"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "bbs-project"
    labels:
      - "dependencies"
      - "security"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "bbs-project"
    labels:
      - "dependencies"
      - "ci/cd"
